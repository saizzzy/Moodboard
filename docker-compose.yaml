services:
  backend:
    build: ./backend
    container_name: moodboard-backend
    restart: always
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: moodboard-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend